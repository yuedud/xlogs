<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xlogs HTML Demo</title>
</head>
<body>
    <h1>xlogs 模块使用示例</h1>
    <p>打开浏览器控制台查看日志输出。</p>

    <!-- 引入编译后的 xlogs 模块 -->
    <script type="module">
        import {xlogs} from './dist/xlogs.esm.js';

        // 气泡对话 - 展示所有类型
        xlogs.bubble('你好，我是机器人', 'bot');
        xlogs.bubble('你好，我是用户', 'user');

        // 天气主题 - 展示所有天气类型
        xlogs.weather('sunny', '今天阳光明媚');
        xlogs.weather('rainy', '外面正在下雨');
        xlogs.weather('cloudy', '今天多云转阴');

        // ASCII艺术 - 展示所有边框类型
        xlogs.ascii('通知', 'box');
        xlogs.ascii('提示', 'cloud');
        xlogs.ascii('波浪', 'wave');

        // 3D文字 - 展示所有特效类型
        xlogs.banner('欢迎', 'shadow');
        xlogs.banner('XLOGS', 'neon');
        xlogs.banner('v2.0', 'outline');

    </script>
</body>
</html>
